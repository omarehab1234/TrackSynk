<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KPI SaaS - Login</title>

    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      .container {
        background: white;
        padding: 35px;
        border-radius: 12px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      }

      h2 {
        text-align: center;
        margin-bottom: 25px;
      }

      label {
        font-weight: bold;
        display: block;
      }

      input {
        width: 100%;
        padding: 12px;
        margin: 8px 0 16px;
        border: 1px solid #ddd;
        border-radius: 6px;
      }

      button {
        width: 100%;
        padding: 13px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #1d4ed8;
      }

      button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      #message {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
      }

      .footer-link {
        margin-top: 18px;
        text-align: center;
        font-size: 14px;
      }

      .footer-link a {
        color: #2563eb;
        text-decoration: none;
      }

      .footer-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Login</h2>

      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="current-password"
        />

        <button type="submit" id="submitBtn">Login</button>
      </form>

      <p id="message" role="alert"></p>

      <div class="footer-link">
        Don't have an account? <a href="/register">Create account</a>
      </div>
    </div>

    <script>
      const form = document.getElementById("loginForm");
      const submitBtn = document.getElementById("submitBtn");
      const message = document.getElementById("message");

      const params = new URLSearchParams(window.location.search);
      if (params.get("registered") === "true") {
        message.style.color = "green";
        message.textContent = "Account created. Please log in.";
      } else if (params.get("logout") === "true") {
        message.style.color = "#374151";
        message.textContent = "You have been logged out.";
      }

      async function extractErrorMessage(response) {
        const contentType = response.headers.get("content-type") || "";
        const rawText = await response.text();
        if (!rawText) {
          return "Invalid email or password.";
        }

        if (contentType.includes("application/json")) {
          try {
            const data = JSON.parse(rawText);
            if (typeof data === "string") return data;
            if (data.message) return data.message;
            if (data.error && typeof data.error === "string") return data.error;
            if (data.errors && typeof data.errors === "object") {
              const firstError = Object.values(data.errors)[0];
              if (firstError) return String(firstError);
            }
          } catch (_) {
            // Fall back to plain text below
          }
        }

        return rawText;
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const payload = {
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        };

        const csrfMeta = document.querySelector('meta[name="_csrf"]');
        const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
        const headers = {
          "Content-Type": "application/json",
        };

        if (csrfMeta && csrfHeaderMeta && csrfMeta.content && csrfHeaderMeta.content) {
          headers[csrfHeaderMeta.content] = csrfMeta.content;
        }

        submitBtn.disabled = true;
        message.style.color = "#374151";
        message.textContent = "Signing in...";

        try {
          const response = await fetch("/api/users/login", {
            method: "POST",
            headers,
            body: JSON.stringify(payload),
          });

          if (response.ok) {
            await response.json().catch(() => null);
            message.style.color = "green";
            message.textContent = "Login successful! Redirecting...";
            window.location.href = "/choose";
          } else {
            message.style.color = "red";
            message.textContent = await extractErrorMessage(response);
            submitBtn.disabled = false;
          }
        } catch (error) {
          message.style.color = "red";
          message.textContent = "Could not connect to the server.";
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
