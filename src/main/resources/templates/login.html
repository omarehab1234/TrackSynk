<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <style>
      * { box-sizing: border-box; }
      body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .container {
        background: white;
        padding: 35px;
        border-radius: 12px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      }
      h2 { text-align: center; margin-bottom: 25px; }
      input {
        width: 100%;
        padding: 12px;
        margin: 8px 0 16px;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
      label { font-weight: bold; }
      button {
        width: 100%;
        padding: 13px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover { background: #1d4ed8; }
      #message { margin-top: 15px; text-align: center; }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Login</h2>

      <form id="loginForm">
        <label>Email</label>
        <input type="email" id="email" required />

        <label>Password</label>
        <input type="password" id="password" required />

        <button type="submit">Login</button>
      </form>

      <p id="message"></p>
    </div>

    <script>
      const form = document.getElementById("loginForm");
      const message = document.getElementById("message");

      // Message shown when coming from the register page
      if (new URLSearchParams(window.location.search).get("registered")) {
        message.style.color = "green";
        message.textContent = "Account created. Please log in.";
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const request = {
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        };

        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        try {
          const response = await fetch("/api/users/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              [csrfHeader]: csrfToken,
            },
            body: JSON.stringify(request),
          });

          if (response.ok) {
            const data = await response.json();
            localStorage.setItem("token", data.token);
            message.style.color = "green";
            message.textContent = "Login successful!";
            window.location.href = "/companies/choose";
          } else {
            const error = await response.text();
            message.style.color = "red";
            message.textContent = error || "Invalid email or password.";
          }
        } catch (error) {
          message.style.color = "red";
          message.textContent = "Could not connect to the server.";
        }
      });
    </script>
  </body>
</html>
