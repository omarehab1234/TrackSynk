<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join Company</title>

    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6fb;
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px 0;
      }
      .card {
        background: white;
        width: min(480px, 90%);
        padding: 35px;
        border-radius: 14px;
        box-shadow: 0 5px 20px #0000000d;
      }
      h1 {
        color: #172554;
        margin: 0 0 8px;
      }
      p {
        color: #64748b;
        line-height: 1.5;
        margin: 0;
      }
      .company-stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 24px;
      }
      .company-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 14px 16px;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        background: #f8fafc;
      }
      .company-info {
        min-width: 0;
      }
      .company-name {
        font-weight: 600;
        color: #0f172a;
        font-size: 15px;
      }
      .company-slug {
        font-size: 13px;
        color: #64748b;
        margin-top: 3px;
      }
      button.join-btn {
        flex-shrink: 0;
        padding: 10px 16px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
      }
      button.join-btn:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .empty-state {
        padding: 20px;
        text-align: center;
        border: 1px dashed #cbd5e1;
        border-radius: 10px;
        color: #64748b;
      }
      .message {
        margin-top: 16px;
        font-size: 14px;
        line-height: 1.5;
      }
      .error {
        color: #dc2626;
      }
      .success {
        color: #15803d;
      }
      .footer-link {
        margin-top: 22px;
      }
      a {
        color: #2563eb;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>Join a company</h1>
      <p>Select a company from the list below to join its workspace.</p>

      <div id="companyStack" class="company-stack">
        <div class="empty-state">Checking your account...</div>
      </div>

      <div id="message" class="message" role="alert"></div>

      <p class="footer-link">
        <a th:href="@{/companies/choose}">Back</a>
      </p>
    </div>

    <script>
      const stackContainer = document.getElementById("companyStack");
      const messageEl = document.getElementById("message");

      function setMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = type ? `message ${type}` : "message";
      }

      async function parseResponseBody(response) {
        const rawText = await response.text();
        let data = null;

        if (rawText) {
          try {
            data = JSON.parse(rawText);
          } catch (_) {
            data = null;
          }
        }

        return { rawText, data };
      }

      function setAllButtonsDisabled(disabled) {
        const buttons = stackContainer.querySelectorAll("button.join-btn");
        buttons.forEach((btn) => (btn.disabled = disabled));
      }

      // Check the current user's account status.
      async function getCurrentUser() {
        const response = await fetch("/api/users/me", {
          headers: { Accept: "application/json" },
        });

        const { rawText, data } = await parseResponseBody(response);

        if (!response.ok) {
          throw new Error(
            (data && (data.message || data.error)) ||
              "Could not retrieve your account information.",
          );
        }

        return data;
      }

      // Display the appropriate UI according to user status.
      function renderStatus(status) {
        stackContainer.innerHTML = "";

        if (status === "PENDING") {
          setMessage(
            "Your request is pending. Please wait until the company admin approves your request.",
            "error",
          );
          return false;
        }

        if (status === "ACTIVE") {
          setMessage(
            "You already belong to a company. You can access your dashboard.",
            "success",
          );

          const dashboardBtn = document.createElement("button");
          dashboardBtn.className = "join-btn";
          dashboardBtn.textContent = "Go to Dashboard";

          dashboardBtn.addEventListener("click", () => {
            window.location.href = "/dashboard";
          });

          stackContainer.appendChild(dashboardBtn);
          return false;
        }

        if (status === "REJECTED") {
          setMessage(
            "Your previous request was rejected. You can request to join another company.",
            "error",
          );
        } else {
          // null status: user has not requested to join a company.
          setMessage("", "");
        }

        return true;
      }

      async function joinCompany(slug, buttonEl) {
        setMessage("", "");
        setAllButtonsDisabled(true);

        const originalText = buttonEl.textContent;
        buttonEl.textContent = "Requesting...";

        try {
          const csrfToken =
            document.querySelector('meta[name="_csrf"]').content;

          const csrfHeader = document.querySelector(
            'meta[name="_csrf_header"]',
          ).content;

          const response = await fetch("/api/companies/join", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              [csrfHeader]: csrfToken,
            },
            body: JSON.stringify({ slug }),
          });

          const { rawText, data } = await parseResponseBody(response);

          if (!response.ok) {
            const isHtml = rawText && rawText.trim().startsWith("<");

            throw new Error(
              (data && (data.message || data.error)) ||
                (!isHtml && rawText) ||
                "Could not request to join company.",
            );
          }

          setMessage(
            "Your request was submitted successfully. Redirecting...",
            "success",
          );

          //window.location.href = "/companies/pending";
        } catch (error) {
          setMessage(error.message || "Could not join company.", "error");
          buttonEl.textContent = originalText;
          setAllButtonsDisabled(false);
        }
      }

      function renderCompanies(companies) {
        stackContainer.innerHTML = "";

        if (!Array.isArray(companies) || companies.length === 0) {
          stackContainer.innerHTML =
            '<div class="empty-state">No active companies available yet.</div>';
          return;
        }

        companies.forEach((company) => {
          const item = document.createElement("div");
          item.className = "company-item";

          const info = document.createElement("div");
          info.className = "company-info";

          const name = document.createElement("div");
          name.className = "company-name";
          name.textContent = company.name || "Unnamed Company";

          const slug = document.createElement("div");
          slug.className = "company-slug";
          slug.textContent = company.slug ? `Slug: ${company.slug}` : "";

          info.appendChild(name);

          if (company.slug) {
            info.appendChild(slug);
          }

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "join-btn";
          btn.textContent = "Join";

          btn.addEventListener("click", () => {
            joinCompany(company.slug, btn);
          });

          item.appendChild(info);
          item.appendChild(btn);
          stackContainer.appendChild(item);
        });
      }

      async function loadCompanies() {
        try {
          // First check the user's status.
          const user = await getCurrentUser();

          const canJoin = renderStatus(user.status);

          // Pending and active users cannot request another company.
          if (!canJoin) return;

          // Only users with null or rejected status reach this point.
          const response = await fetch("/api/companies", {
            method: "GET",
            headers: { Accept: "application/json" },
          });

          const { rawText, data } = await parseResponseBody(response);

          if (!response.ok) {
            throw new Error(
              (data && (data.message || data.error)) ||
                rawText ||
                "Could not load companies.",
            );
          }

          renderCompanies(data);
        } catch (error) {
          stackContainer.innerHTML =
            '<div class="empty-state">Unable to load companies right now.</div>';

          setMessage(error.message || "Could not load companies.", "error");
        }
      }

      loadCompanies();
    </script>
  </body>
</html>
