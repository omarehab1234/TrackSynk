<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Company Admin Dashboard</title>

    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        margin: 0;
        padding: 32px 16px;
        color: #111827;
      }

      .container {
        max-width: 1040px;
        margin: 0 auto;
        display: grid;
        gap: 24px;
      }

      .card {
        background: #ffffff;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
      }

      h1, h2 {
        margin-top: 0;
      }

      .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .subtitle {
        color: #6b7280;
        font-size: 14px;
        margin: 6px 0 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 14px;
      }

      th, td {
        text-align: left;
        padding: 12px;
        border-bottom: 1px solid #e5e7eb;
        font-size: 14px;
        vertical-align: middle;
      }

      th {
        background: #f9fafb;
        color: #374151;
        font-weight: 600;
      }

      select, input[type="text"] {
        padding: 9px 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 14px;
        background: #ffffff;
      }

      select:focus, input[type="text"]:focus {
        outline: 2px solid #93c5fd;
        border-color: #2563eb;
      }

      button {
        padding: 9px 14px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        font-weight: 500;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .btn-primary {
        background: #2563eb;
        color: #ffffff;
      }

      .btn-primary:hover:not(:disabled) {
        background: #1d4ed8;
      }

      .btn-approve {
        background: #16a34a;
        color: #ffffff;
        margin-right: 6px;
      }

      .btn-approve:hover:not(:disabled) {
        background: #15803d;
      }

      .btn-deny {
        background: #dc2626;
        color: #ffffff;
      }

      .btn-deny:hover:not(:disabled) {
        background: #b91c1c;
      }

      .inline-form {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .inline-form input[type="text"] {
        flex: 1;
        min-width: 220px;
      }

      .empty-msg {
        color: #6b7280;
        font-size: 14px;
        margin-top: 12px;
      }

      .alert {
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
      }

      .alert-success {
        background: #dcfce7;
        color: #166534;
        border: 1px solid #86efac;
      }

      .alert-error {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fca5a5;
      }

      ul.dept-list {
        list-style: none;
        padding: 0;
        margin: 16px 0 0;
        display: grid;
        gap: 10px;
      }

      ul.dept-list li {
        padding: 12px 16px;
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .dept-desc {
        color: #6b7280;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card header-bar">
        <div>
          <h1>Company Admin Dashboard</h1>
          <p class="subtitle">Review join requests, assign roles and departments, and manage company departments.</p>
        </div>
        <form th:action="@{/logout}" method="post">
          <button type="submit" class="btn-deny">Logout</button>
        </form>
      </div>

      <div id="banner" style="display: none;" role="status"></div>

      <!-- Pending Join Requests & Role / Department Assignment -->
      <div class="card">
        <h2>Pending Join Requests</h2>
        <p class="subtitle">Role is required before approving; department is optional and scoped to your company.</p>
        <div id="requestsContainer">
          <p class="empty-msg">Loading pending join requests...</p>
        </div>
      </div>

      <!-- Departments Creation & Listing -->
      <div class="card">
        <h2>Departments</h2>
        <form id="createDeptForm" class="inline-form">
          <input
            type="text"
            id="deptName"
            name="name"
            placeholder="Department name (e.g., Engineering, Product)"
            required
            maxlength="150"
          />
          <input
            type="text"
            id="deptDescription"
            name="description"
            placeholder="Optional description"
            maxlength="500"
          />
          <button type="submit" id="createDeptBtn" class="btn-primary">Create Department</button>
        </form>
        <div id="departmentsContainer">
          <p class="empty-msg">Loading departments...</p>
        </div>
      </div>
    </div>

    <script th:inline="javascript">
      const ASSIGNABLE_ROLES = [
        { value: "EXECUTIVE", label: "Executive" },
        { value: "DEPARTMENT_MANAGER", label: "Department Manager" },
        { value: "EMPLOYEE", label: "Employee" }
      ];

      let availableDepartments = [];

      const csrfMeta = document.querySelector('meta[name="_csrf"]');
      const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
      const banner = document.getElementById("banner");
      const requestsContainer = document.getElementById("requestsContainer");
      const departmentsContainer = document.getElementById("departmentsContainer");
      const createDeptForm = document.getElementById("createDeptForm");
      const createDeptBtn = document.getElementById("createDeptBtn");

      function getHeaders(includeJson = true) {
        const headers = {};
        if (includeJson) {
          headers["Content-Type"] = "application/json";
        }
        if (csrfMeta && csrfHeaderMeta && csrfMeta.content && csrfHeaderMeta.content) {
          headers[csrfHeaderMeta.content] = csrfMeta.content;
        }
        return headers;
      }

      function showBanner(text, isError = false) {
        banner.className = `alert ${isError ? "alert-error" : "alert-success"}`;
        banner.textContent = text;
        banner.style.display = "block";
      }

      function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value == null ? "" : String(value);
        return div.innerHTML;
      }

      async function extractErrorMessage(response, fallback) {
        const text = await response.text();
        if (!text) return fallback;
        try {
          const parsed = JSON.parse(text);
          if (parsed && typeof parsed.message === "string" && parsed.message.trim()) {
            return parsed.message;
          }
          if (parsed && typeof parsed.error === "string" && parsed.error.trim()) {
            return parsed.error;
          }
        } catch (_) {
          // Plain text response
        }
        return text;
      }

      function formatMemberName(user) {
        const full = `${user.firstName || ""} ${user.lastName || ""}`.trim();
        return full || user.email || "User";
      }

      async function loadJoinRequests() {
        try {
          const res = await fetch("/api/admin/join-requests", {
            headers: getHeaders(false)
          });

          if (!res.ok) {
            const msg = await extractErrorMessage(res, "Failed to load pending join requests.");
            requestsContainer.innerHTML = `<p class="empty-msg">${escapeHtml(msg)}</p>`;
            return;
          }

          const users = await res.json();
          if (!Array.isArray(users) || users.length === 0) {
            requestsContainer.innerHTML = `<p class="empty-msg">No pending join requests right now.</p>`;
            return;
          }

          const roleOptionsHtml =
            `<option value="">-- Choose Role --</option>` +
            ASSIGNABLE_ROLES.map(
              (r) => `<option value="${escapeHtml(r.value)}">${escapeHtml(r.label)}</option>`
            ).join("");

          const deptOptionsHtml =
            `<option value="">-- No Department --</option>` +
            availableDepartments
              .map(
                (d) => `<option value="${escapeHtml(d.id)}">${escapeHtml(d.name)}</option>`
              )
              .join("");

          const rowsHtml = users
            .map(
              (u) => `
              <tr data-user-id="${escapeHtml(u.id)}">
                <td>${escapeHtml(formatMemberName(u))}</td>
                <td>${escapeHtml(u.email)}</td>
                <td>
                  <select class="role-select" aria-label="Role for ${escapeHtml(u.email)}">
                    ${roleOptionsHtml}
                  </select>
                </td>
                <td>
                  <select class="dept-select" aria-label="Department for ${escapeHtml(u.email)}">
                    ${deptOptionsHtml}
                  </select>
                </td>
                <td>
                  <button type="button" class="btn-approve" onclick="approveUser('${escapeHtml(u.id)}', this)">Approve</button>
                  <button type="button" class="btn-deny" onclick="denyUser('${escapeHtml(u.id)}', this)">Deny</button>
                </td>
              </tr>
            `
            )
            .join("");

          requestsContainer.innerHTML = `
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Assign Role</th>
                  <th>Assign Department</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          `;
        } catch (err) {
          requestsContainer.innerHTML = `<p class="empty-msg">Network error while loading join requests.</p>`;
        }
      }

      window.approveUser = async function (userId, buttonEl) {
        const row = buttonEl.closest("tr");
        const roleSelectEl = row ? row.querySelector(".role-select") : null;
        const deptSelectEl = row ? row.querySelector(".dept-select") : null;
        const selectedRole = roleSelectEl ? roleSelectEl.value : "";
        const selectedDepartmentId = deptSelectEl && deptSelectEl.value ? deptSelectEl.value : null;

        if (!selectedRole) {
          showBanner("Please select a role before approving this user.", true);
          if (roleSelectEl) roleSelectEl.focus();
          return;
        }

        const actionButtons = row ? row.querySelectorAll("button") : [buttonEl];
        actionButtons.forEach((b) => (b.disabled = true));

        try {
          const res = await fetch(`/api/admin/join-requests/${encodeURIComponent(userId)}/approve`, {
            method: "POST",
            headers: getHeaders(true),
            body: JSON.stringify({
              role: selectedRole,
              departmentId: selectedDepartmentId
            })
          });

          if (!res.ok) {
            const msg = await extractErrorMessage(res, "Could not approve join request.");
            showBanner(msg, true);
            actionButtons.forEach((b) => (b.disabled = false));
            return;
          }

          showBanner("User approved and assigned role/department.");
          await loadJoinRequests();
        } catch (err) {
          showBanner("Network error while approving join request.", true);
          actionButtons.forEach((b) => (b.disabled = false));
        }
      };

      window.denyUser = async function (userId, buttonEl) {
        const row = buttonEl.closest("tr");
        const actionButtons = row ? row.querySelectorAll("button") : [buttonEl];
        actionButtons.forEach((b) => (b.disabled = true));

        try {
          const res = await fetch(`/api/admin/join-requests/${encodeURIComponent(userId)}/deny`, {
            method: "POST",
            headers: getHeaders(false)
          });

          if (!res.ok) {
            const msg = await extractErrorMessage(res, "Could not deny join request.");
            showBanner(msg, true);
            actionButtons.forEach((b) => (b.disabled = false));
            return;
          }

          showBanner("Join request denied.");
          await loadJoinRequests();
        } catch (err) {
          showBanner("Network error while denying join request.", true);
          actionButtons.forEach((b) => (b.disabled = false));
        }
      };

      async function loadDepartments(refreshRequests = false) {
        try {
          const res = await fetch("/api/admin/departments", {
            headers: getHeaders(false)
          });

          if (!res.ok) {
            const msg = await extractErrorMessage(res, "Failed to load departments.");
            departmentsContainer.innerHTML = `<p class="empty-msg">${escapeHtml(msg)}</p>`;
            return;
          }

          const departments = await res.json();
          availableDepartments = Array.isArray(departments) ? departments : [];

          if (availableDepartments.length === 0) {
            departmentsContainer.innerHTML = `<p class="empty-msg">No departments created yet.</p>`;
          } else {
            departmentsContainer.innerHTML = `
              <ul class="dept-list">
                ${availableDepartments
                  .map(
                    (d) => `
                    <li>
                      <strong>${escapeHtml(d.name)}</strong>
                      ${d.description ? `<span class="dept-desc">${escapeHtml(d.description)}</span>` : ""}
                    </li>
                  `
                  )
                  .join("")}
              </ul>
            `;
          }

          if (refreshRequests) {
            await loadJoinRequests();
          }
        } catch (err) {
          departmentsContainer.innerHTML = `<p class="empty-msg">Network error while loading departments.</p>`;
        }
      }

      createDeptForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        const nameInput = document.getElementById("deptName");
        const descInput = document.getElementById("deptDescription");

        const name = nameInput.value.trim();
        const description = descInput.value.trim();

        if (!name) {
          showBanner("Department name is required.", true);
          nameInput.focus();
          return;
        }

        createDeptBtn.disabled = true;
        try {
          const payload = { name };
          if (description) {
            payload.description = description;
          }

          const res = await fetch("/api/admin/departments", {
            method: "POST",
            headers: getHeaders(true),
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const msg = await extractErrorMessage(res, "Could not create department.");
            showBanner(msg, true);
            return;
          }

          nameInput.value = "";
          descInput.value = "";
          showBanner("Department created.");
          await loadDepartments(true);
        } catch (err) {
          showBanner("Network error while creating department.", true);
        } finally {
          createDeptBtn.disabled = false;
        }
      });

      async function initDashboard() {
        await loadDepartments(false);
        await loadJoinRequests();
      }

      initDashboard();
    </script>
  </body>
</html>
