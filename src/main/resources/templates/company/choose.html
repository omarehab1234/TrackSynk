<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Company Setup</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6fb;
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
      }
      .container {
        width: min(850px, 90%);
        text-align: center;
      }
      .options {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
        margin-top: 35px;
      }
      .option {
        background: white;
        padding: 35px 25px;
        border-radius: 14px;
        box-shadow: 0 5px 20px #0000000d;
      }
      h1 {
        color: #172554;
      }
      p {
        color: #64748b;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        background: #2563eb;
        color: white;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 8px;
        margin-top: 15px;
      }
      a:hover {
        background: #1d4ed8;
      }
      @media (max-width: 600px) {
        .options {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Welcome!</h1>
      <p>To get started, create your company or join an existing one.</p>

      <div class="options">
        <div class="option">
          <h2>Create a Company</h2>
          <p>Set up your organization and become its company administrator.</p>
          <a th:href="@{/companies/create}">Create Company</a>
        </div>

        <div class="option">
          <h2>Join a Company</h2>
          <p>
            Already have an organization? Request to join using its company
            slug.
          </p>
          <a th:href="@{/companies/join}">Join Company</a>
        </div>
      </div>
    </div>
  </body>
</html>
