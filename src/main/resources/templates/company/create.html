<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Company</title>

    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6fb;
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
      }
      .card {
        background: white;
        width: min(420px, 85%);
        padding: 35px;
        border-radius: 14px;
        box-shadow: 0 5px 20px #0000000d;
      }
      h1 {
        color: #172554;
      }
      p {
        color: #64748b;
      }
      label {
        display: block;
        margin: 22px 0 8px;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 13px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
      }
      button {
        width: 100%;
        padding: 13px;
        margin-top: 20px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .message {
        margin-top: 15px;
      }
      .error {
        color: #dc2626;
      }
      .success {
        color: #15803d;
      }
      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Create your company</h1>
      <p>Create an organization and become its administrator.</p>

      <form id="createCompanyForm">
        <label for="companyName">Company name</label>
        <input
          type="text"
          id="companyName"
          name="companyName"
          placeholder="e.g. Darwish Technologies"
          maxlength="255"
          required
        />

        <button type="submit" id="submitBtn">Create Company</button>
      </form>

      <div id="message" class="message" role="alert"></div>

      <p><a th:href="@{/companies/choose}">Back</a></p>
    </div>

    <script>
      const form = document.getElementById("createCompanyForm");
      const button = document.getElementById("submitBtn");
      const message = document.getElementById("message");

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const companyName = document.getElementById("companyName").value.trim();

        if (!companyName) return;

        button.disabled = true;
        button.textContent = "Creating...";
        message.textContent = "";
        message.className = "message";

        try {
          const csrfToken =
            document.querySelector('meta[name="_csrf"]').content;
          const csrfHeader = document.querySelector(
            'meta[name="_csrf_header"]',
          ).content;

          const response = await fetch("/api/companies", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              [csrfHeader]: csrfToken,
            },
            body: JSON.stringify({ companyName }),
          });

          const rawText = await response.text();
          let data = null;

          if (rawText) {
            try {
              data = JSON.parse(rawText);
            } catch (_) {
              data = null;
            }
          }

          if (!response.ok) {
            const errorMsg =
              (data && (data.message || data.error)) ||
              rawText ||
              "Could not create company.";
            throw new Error(errorMsg);
          }

          message.textContent = "Company created successfully!";
          message.classList.add("success");

          window.location.href = "/dashboard";
        } catch (error) {
          message.textContent = error.message || "Could not create company.";
          message.classList.add("error");
        } finally {
          button.disabled = false;
          button.textContent = "Create Company";
        }
      });
    </script>
  </body>
</html>
