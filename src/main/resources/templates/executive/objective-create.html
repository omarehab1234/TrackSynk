<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Objective | TrackSynk</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f4f6fa;
        color: #1e293b;
      }

      .navbar {
        background: #172554;
        color: white;
        padding: 18px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        font-size: 23px;
        font-weight: bold;
      }

      .nav-right {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .role {
        background: #2563eb;
        padding: 7px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
      }

      .dashboard-link {
        color: white;
        text-decoration: none;
        font-size: 14px;
      }

      .container {
        max-width: 850px;
        margin: 45px auto;
        padding: 0 20px;
      }

      .page-header {
        margin-bottom: 25px;
      }

      .page-header h1 {
        font-size: 28px;
        margin-bottom: 8px;
      }

      .page-header p {
        color: #64748b;
        font-size: 14px;
      }

      .form-card {
        background: white;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 3px 15px rgba(0, 0, 0, 0.05);
      }

      .form-group {
        margin-bottom: 23px;
      }

      .form-group label,
      .section-title {
        display: block;
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 9px;
      }

      .required {
        color: #dc2626;
      }

      input[type="text"],
      input[type="date"],
      textarea {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font-size: 14px;
        outline: none;
        transition: 0.2s;
      }

      input:focus,
      textarea:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      textarea {
        resize: vertical;
        min-height: 120px;
      }

      .date-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .department-section {
        margin-bottom: 25px;
      }

      .department-section p {
        color: #64748b;
        font-size: 13px;
        margin-bottom: 13px;
      }

      .department-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .department-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px;
        border: 1px solid #e2e8f0;
        border-radius: 7px;
        cursor: pointer;
        transition: 0.2s;
      }

      .department-item:hover {
        border-color: #2563eb;
        background: #f8faff;
      }

      .department-item input {
        accent-color: #2563eb;
        width: 16px;
        height: 16px;
      }

      .department-item span {
        font-size: 14px;
      }

      .empty-departments {
        padding: 15px;
        background: #f8fafc;
        border-radius: 7px;
        color: #64748b;
        font-size: 14px;
      }

      .error {
        color: #dc2626;
        font-size: 12px;
        margin-top: 6px;
      }

      .alert {
        padding: 13px;
        border-radius: 7px;
        margin-bottom: 20px;
        font-size: 14px;
      }

      .alert-error {
        background: #fee2e2;
        color: #991b1b;
      }

      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 30px;
        border-top: 1px solid #e2e8f0;
        padding-top: 25px;
      }

      .btn {
        padding: 12px 22px;
        border-radius: 7px;
        border: none;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        text-decoration: none;
      }

      .btn-cancel {
        background: #e2e8f0;
        color: #334155;
      }

      .btn-submit {
        background: #2563eb;
        color: white;
      }

      .btn-submit:hover {
        background: #1d4ed8;
      }

      @media (max-width: 600px) {
        .date-row,
        .department-list {
          grid-template-columns: 1fr;
        }

        .form-card {
          padding: 22px;
        }

        .navbar {
          padding: 16px 20px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="logo">TrackSynk</div>

      <div class="nav-right">
        <span class="role">EXECUTIVE</span>
        <a th:href="@{/executive/dashboard}" class="dashboard-link">
          Dashboard
        </a>
      </div>
    </nav>

    <div class="container">
      <!-- Page Header -->
      <div class="page-header">
        <h1>Create Company Objective</h1>
        <p>
          Create a strategic objective and assign it to the departments
          responsible for achieving it.
        </p>
      </div>

      <div class="form-card">
        <!-- General Error -->
        <div
          class="alert alert-error"
          th:if="${errorMessage}"
          th:text="${errorMessage}"
        ></div>

        <div class="form-card">
          <div
            class="alert alert-error"
            th:if="${errorMessage}"
            th:text="${errorMessage}"
          ></div>

          <form
            th:action="@{/executive/objectives}"
            th:object="${objectiveRequest}"
            method="post"
          >
            <!-- CSRF -->
            <input
              type="hidden"
              th:if="${_csrf != null}"
              th:name="${_csrf.parameterName}"
              th:value="${_csrf.token}"
            />

            <!-- Title -->
            <div class="form-group">
              <label for="title">
                Objective Title <span class="required">*</span>
              </label>

              <input
                type="text"
                id="title"
                th:field="*{title}"
                placeholder="Enter company objective title"
              />

              <div
                class="error"
                th:if="${#fields.hasErrors('title')}"
                th:errors="*{title}"
              ></div>
            </div>

            <!-- Description -->
            <div class="form-group">
              <label for="description">Description</label>

              <textarea
                id="description"
                th:field="*{description}"
                placeholder="Describe what the company aims to achieve..."
              ></textarea>

              <div
                class="error"
                th:if="${#fields.hasErrors('description')}"
                th:errors="*{description}"
              ></div>
            </div>

            <!-- Dates -->
            <div class="date-row">
              <div class="form-group">
                <label for="startDate">
                  Start Date <span class="required">*</span>
                </label>

                <input type="date" id="startDate" th:field="*{startDate}" />

                <div
                  class="error"
                  th:if="${#fields.hasErrors('startDate')}"
                  th:errors="*{startDate}"
                ></div>
              </div>

              <div class="form-group">
                <label for="endDate">
                  End Date <span class="required">*</span>
                </label>

                <input type="date" id="endDate" th:field="*{endDate}" />

                <div
                  class="error"
                  th:if="${#fields.hasErrors('endDate')}"
                  th:errors="*{endDate}"
                ></div>
              </div>
            </div>

            <!-- Departments -->
            <div class="department-section">
              <label class="section-title">
                Assign Departments <span class="required">*</span>
              </label>

              <p>Select the departments responsible for this objective.</p>

              <div
                class="department-list"
                th:if="${!#lists.isEmpty(departments)}"
              >
                <label
                  class="department-item"
                  th:each="department : ${departments}"
                >
                  <input
                    type="checkbox"
                    th:field="*{departmentIds}"
                    th:value="${department.id}"
                  />

                  <span th:text="${department.name}"></span>
                </label>
              </div>

              <div
                class="empty-departments"
                th:if="${#lists.isEmpty(departments)}"
              >
                No departments are available. Create departments before
                assigning this objective.
              </div>

              <div
                class="error"
                th:if="${#fields.hasErrors('departmentIds')}"
                th:errors="*{departmentIds}"
              ></div>
            </div>

            <!-- Actions -->
            <div class="form-actions">
              <a th:href="@{/executive/dashboard}" class="btn btn-cancel">
                Cancel
              </a>

              <button
                type="submit"
                class="btn btn-submit"
                th:disabled="${#lists.isEmpty(departments)}"
              >
                Create Objective
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
